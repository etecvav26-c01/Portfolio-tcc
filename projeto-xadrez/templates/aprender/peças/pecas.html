{% extends "base.html" %} {% block title %}Peças do Xadrez - Primeiro Lance{%
endblock %} {% block content %}

<div class="container py-4">
  <div class="row g-4 align-items-center">
    <!-- CONTEÚDO -->

    <div class="col-lg-5">
      <div class="card bg-dark text-light border-secondary">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-warning"> Aula </span>

            <span id="numero-aula"> 1 / 6 </span>
          </div>

          <h2 id="titulo-aula">Peão</h2>

          <div id="conteudo-aula" class="text-secondary"></div>

          <div class="progress mt-4">
            <div
              id="progresso-aula"
              class="progress-bar bg-warning"
              style="width: 16%"
            ></div>
          </div>

          <div class="d-flex justify-content-between mt-4">
            <button
              id="btn-anterior"
              class="btn btn-outline-light"
              onclick="aulaAnterior()"
            >
              ← Anterior
            </button>

            <button
              id="btn-proxima"
              class="btn btn-warning"
              onclick="proximaAula()"
            >
              Próxima →
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- TABULEIRO -->

    <div class="col-lg-7">
      <div class="d-flex justify-content-center">
        <div id="board"></div>
      </div>
    </div>
  </div>
</div>

<script
  type="module"
  src="{{ url_for('static', filename='js/aprender/course.js') }}"
></script>

<script
  type="module"
  src="{{ url_for('static', filename='js/main.js') }}"
></script>

{% endblock %}

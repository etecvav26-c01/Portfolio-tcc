{% extends "base.html" %}

{% block title %}Aberturas - Primeiro Lance{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="row g-4 align-items-center">

        <div class="col-lg-5">

            <div class="card bg-dark text-light border-secondary">

                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <span class="text-warning">
                            Princípios de Abertura
                        </span>

                        <span id="numero-aula">
                            1 / 3
                        </span>

                    </div>


                    <h2 id="titulo-aula">
                        Controle do centro
                    </h2>


                    <div
                        id="conteudo-aula"
                        class="text-secondary"
                    ></div>


                    <div class="progress mt-4">

                        <div
                            id="progresso-aula"
                            class="progress-bar bg-warning"
                            style="width: 33%"
                        ></div>

                    </div>


                    <div class="d-flex justify-content-between mt-4">

                        <button
                            id="btn-anterior"
                            class="btn btn-outline-light"
                            onclick="aulaAnterior()"
                            disabled
                        >
                            ← Anterior
                        </button>


                        <button
                            id="btn-proxima"
                            class="btn btn-warning"
                            onclick="proximaAula()"
                        >
                            Próxima →
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <div class="col-lg-7">

            <div class="d-flex justify-content-center">

                <div id="board"></div>

            </div>

        </div>

    </div>

</div>


<script type="module">

    import { PLBoard }
        from "{{ url_for('static', filename='js/board-config/board.js') }}";

    import { PLCourse }
        from "{{ url_for('static', filename='js/aprender/course.js') }}";

    import { cursos }
        from "{{ url_for('static', filename='js/aprender/course-data.js') }}";

    import {
        atualizarAula
    }
    from "{{ url_for('static', filename='js/aprender/course-page.js') }}";


    document.addEventListener(
        "DOMContentLoaded",
        () => {

            const board =
                new PLBoard({
                    element: "board",
                    draggable: true
                });


            window.cursoAtual =
                new PLCourse(
                    board,
                    cursos.aberturas
                );


            window.cursoAtual.iniciar();

            atualizarAula();

        }
    );

</script>

{% endblock %}

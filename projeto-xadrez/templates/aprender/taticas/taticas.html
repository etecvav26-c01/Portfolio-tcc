{% extends "base.html" %}

{% block title %}
Táticas de Xadrez - Primeiro Lance
{% endblock %}


{% block content %}

<div
    class="container py-4"
    id="course-container"
    data-curso="taticas"
>

    <div class="mb-4">

        <h1 id="titulo-aula">
            Carregando...
        </h1>

        <p class="text-secondary mb-0">
            Aula
            <span id="numero-aula">
                1 / 3
            </span>
        </p>

        <div class="progress mt-3">

            <div
                id="progresso-aula"
                class="progress-bar bg-warning"
                style="width: 0%;"
            ></div>

        </div>

    </div>


    <div class="row g-4">

        <div class="col-lg-6">

            <div class="card bg-dark border-secondary h-100">

                <div class="card-body">

                    <div id="conteudo-aula">
                        <p class="text-secondary">
                            Carregando conteúdo...
                        </p>
                    </div>

                </div>

            </div>

        </div>


        <div class="col-lg-6">

            <div class="card bg-dark border-secondary">

                <div class="card-body">

                    <div
                        id="board"
                        class="mx-auto"
                        style="width: 100%; max-width: 500px;"
                    ></div>

                </div>

            </div>

        </div>

    </div>


    <div class="d-flex justify-content-between mt-4">

        <button
            type="button"
            id="btn-anterior"
            class="btn btn-secondary"
            onclick="aulaAnterior()"
            disabled
        >
            ← Anterior
        </button>


        <button
            type="button"
            id="btn-proxima"
            class="btn btn-warning"
            onclick="proximaAula()"
        >
            Próxima →
        </button>

    </div>

</div>


<script
    type="module"
    src="{{ url_for('static', filename='js/main.js') }}"
></script>

{% endblock %}

{% extends "base.html" %} {% block content %}

<div class="container py-4">
  <div class="card mb-4">
    <div class="card-body">
      <h2 class="text-warning" style="text-align: center;">Exercícios de Xadrez</h2>

      <p class="text-secondary mb-0" style="text-align: center;">
        Teste do motor de tabuleiro do Primeiro Lance.
      </p>
    </div>
  </div>

  <div class="row g-4">
    <!-- TABULEIRO -->

    <div class="col-lg-8">
      <div id="board" style="max-width: 600px; width: 100%; margin: auto"></div>
    </div>

    <!-- CONTROLES -->

    <div class="col-lg-4">
      <div class="card mb-4">
        <div class="card-body">
          <h5 class="mb-3">Controles</h5>

          <button class="btn btn-warning w-100 mb-2" onclick="reiniciar()">
            Reiniciar
          </button>

          <button class="btn btn-secondary w-100 mb-2" onclick="desfazer()">
            Desfazer
          </button>

          <button class="btn btn-secondary w-100 mb-2" onclick="girar()">
            Girar tabuleiro
          </button>

          <button class="btn btn-info w-100" onclick="mostrarFen()">FEN</button>
        </div>
      </div>

      <!-- INFORMAÇÕES -->

      <div class="card">
        <div class="card-body">
          <h5>Informações</h5>

          <p class="mb-1">
            <strong>Vez:</strong>

            <span id="turno"> Brancas </span>
          </p>

          <p class="mb-1 mt-3">
            <strong>FEN:</strong>
          </p>

          <textarea id="fen" class="form-control" rows="5" readonly> </textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function reiniciar() {
    if (window.PLBoard) {
      window.PLBoard.reset();

      atualizarInformacoes();
    }
  }

  function desfazer() {
    if (window.PLBoard) {
      window.PLBoard.undo();

      atualizarInformacoes();
    }
  }

  function girar() {
    if (window.PLBoard) {
      window.PLBoard.flip();
    }
  }

  function mostrarFen() {
    if (!window.PLBoard) {
      return;
    }

    document.getElementById("fen").value = window.PLBoard.fen();
  }

  function atualizarInformacoes() {
    if (!window.PLBoard) {
      return;
    }

    document.getElementById("fen").value = window.PLBoard.fen();

    const turno = window.PLBoard.turn();

    document.getElementById("turno").textContent =
      turno === "w" ? "Brancas" : "Pretas";
  }

  // Atualiza as informações
  // periodicamente.
  setInterval(atualizarInformacoes, 500);
</script>

<script
  type="module"
  src="{{ url_for(
        'static',
        filename='js/main.js'
    ) }}"
></script>

{% endblock %}

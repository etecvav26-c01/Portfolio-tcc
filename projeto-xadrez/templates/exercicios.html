  {% extends "base.html" %} {% block content %}

  <div id="exercise-container" class="container py-4">
    <!-- CABEÇALHO -->

    <div class="card mb-4">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h2 id="exercise-title" class="text-warning">Exercício</h2>

            <p id="exercise-description" class="text-secondary mb-0">
              Carregando exercício...
            </p>
          </div>

          <span id="exercise-number" class="badge bg-warning text-dark fs-6">
            1 / 3
          </span>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- TABULEIRO -->

      <div class="col-lg-8">
        <div id="board" style="max-width: 600px; width: 100%; margin: auto"></div>
      </div>

      <!-- PAINEL -->

      <div class="col-lg-4">
        <div class="card mb-3">
          <div class="card-body">
            <h5>🎯 Seu objetivo</h5>

            <p class="text-secondary">
              Analise a posição e encontre a melhor jogada.
            </p>

            <div id="exercise-feedback"></div>

            <button
              id="next-exercise"
              class="btn btn-warning w-100 mb-2"
              onclick="proximoExercicio()"
              disabled
            >
              Próximo exercício →
            </button>

            <button
              class="btn btn-secondary w-100"
              onclick="reiniciarExercicio()"
            >
              🔄 Tentar novamente
            </button>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h5>💡 Dica</h5>

            <p class="text-secondary mb-0">
              Antes de jogar, observe a posição e procure por xeques, capturas e
              ameaças.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script
    type="module"
    src="{{ url_for(
          'static',
          filename='js/main.js'
      ) }}"
  ></script>

  {% endblock %}
